<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreatorFlow AI</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, 'Times New Roman', serif;
        color: #17211b;
        background: #f4f0e8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top right, #d9ead9, transparent 45%), #f4f0e8;
      }

      main {
        width: min(720px, calc(100% - 40px));
        padding: 56px 0;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #55735c;
        font: 700 0.8rem/1.2 Arial, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 620px;
        margin: 0;
        font-size: clamp(3rem, 9vw, 6.5rem);
        line-height: 0.92;
        font-weight: 400;
      }

      p {
        max-width: 500px;
        margin: 28px 0 0;
        color: #526057;
        font: 1.1rem/1.6 Arial, sans-serif;
      }

      button {
        margin-top: 32px;
        padding: 14px 20px;
        border: 0;
        border-radius: 4px;
        color: #f7f4ec;
        background: #1f5b3a;
        font: 700 0.9rem Arial, sans-serif;
        cursor: pointer;
      }

      button:hover { background: #16442b; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">CreatorFlow AI</p>
      <h1>Make room for better ideas.</h1>
      <p id="message">Your creator workspace starts here.</p>
      <button id="start-button" type="button">Start creating</button>
    </main>
    <script>
      document.querySelector('#start-button').addEventListener('click', () => {
        document.querySelector('#message').textContent = 'Your first workflow is ready to take shape.';
      });
    </script>
  </body>
</html>
